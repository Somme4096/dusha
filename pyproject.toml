[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dusha"
version = "0.2.0"
description = "Harness-neutral OpenAI gateway with durable memory and affect state"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
dusha = "dusha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dusha"]
artifacts = ["src/dusha/resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
