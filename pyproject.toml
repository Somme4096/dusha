[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dusha"
version = "1.0.21"
description = "Dusha is a harness-agnostic, lightweight and extensible personality layer for LLM companions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Somme4096" }]
keywords = ["llm", "companion", "memory", "affect", "emotion", "agent", "fastapi", "sqlite"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "click>=8.1,<9",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "questionary>=2.1,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.urls]
Homepage = "https://github.com/Somme4096/dusha"
Repository = "https://github.com/Somme4096/dusha"
Documentation = "https://github.com/Somme4096/dusha/tree/main/docs"
Issues = "https://github.com/Somme4096/dusha/issues"

[project.scripts]
dusha = "dusha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dusha"]
artifacts = ["src/dusha/resources/*.json"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/docs", "/deploy", "/config.example.json", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/plugins/*/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
